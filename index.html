<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three Years of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">

<style>
:root {
  --bg-desk: #18110e;
  --cover-bg: #3b1119;
  --cover-border: #6d1c2b;
  --page-bg: #fbf5e6;
  --page-edge: #e6dac3;
  --ink: #2b201c;
  --soft: #7a6859;
  --rose: #8c243b;
  --rose-light: #c8536d;
  --gold: #d4af37;
  --gold-light: #fcf6ba;
  --line: #e2d5be;
  --shadow: rgba(0, 0, 0, 0.4);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-desk: #0f0a08;
    --cover-bg: #270b11;
    --cover-border: #4a111c;
    --page-bg: #231b18;
    --page-edge: #382c27;
    --ink: #eae0cf;
    --soft: #a39282;
    --rose: #e57b93;
    --rose-light: #f0a3b4;
    --gold: #f3cf65;
    --gold-light: #fff8d6;
    --line: #3d302a;
    --shadow: rgba(0, 0, 0, 0.7);
  }
}

:root[data-theme="dark"] {
  --bg-desk: #0f0a08;
  --cover-bg: #270b11;
  --cover-border: #4a111c;
  --page-bg: #231b18;
  --page-edge: #382c27;
  --ink: #eae0cf;
  --soft: #a39282;
  --rose: #e57b93;
  --rose-light: #f0a3b4;
  --gold: #f3cf65;
  --gold-light: #fff8d6;
  --line: #3d302a;
  --shadow: rgba(0, 0, 0, 0.7);
}

:root[data-theme="light"] {
  --bg-desk: #18110e;
  --cover-bg: #3b1119;
  --cover-border: #6d1c2b;
  --page-bg: #fbf5e6;
  --page-edge: #e6dac3;
  --ink: #2b201c;
  --soft: #7a6859;
  --rose: #8c243b;
  --rose-light: #c8536d;
  --gold: #d4af37;
  --gold-light: #fcf6ba;
  --line: #e2d5be;
  --shadow: rgba(0, 0, 0, 0.4);
}

*, *::before, *::after {
  box-sizing: inherit;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  background: var(--bg-desk);
  background-image: 
    radial-gradient(circle at 50% 30%, rgba(140, 36, 59, 0.15) 0%, transparent 70%),
    radial-gradient(circle at 50% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
  color: var(--ink);
  font-family: 'Lora', Georgia, serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
}

/* Birthday Opening Screen Overlay */
#birthdayScreen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: radial-gradient(circle at center, #4a111c 0%, #1c060a 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#birthdayScreen.fade-out {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#bdayCanvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.bday-content {
  position: relative;
  z-index: 2;
  width: min(460px, 90vw);
  border: 1px solid rgba(212, 175, 55, 0.4);
  padding: clamp(28px, 6vw, 44px) clamp(16px, 4vw, 28px);
  border-radius: 12px;
  background: rgba(30, 8, 14, 0.7);
  backdrop-filter: blur(8px);
  box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6), inset 0 0 25px rgba(212, 175, 55, 0.1);
}

.bday-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: var(--gold-light);
  font-size: clamp(17px, 4vw, 22px);
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.bday-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(34px, 8.5vw, 58px);
  font-weight: 700;
  line-height: 1.1;
  margin: 0 0 12px;
  background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 30%, #b38728 60%, #fbf5b7 80%, #aa771c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
}

.bday-btn {
  background: linear-gradient(135deg, #8c243b 0%, #6d1c2b 100%);
  color: var(--gold-light);
  border: 1px solid var(--gold);
  min-height: 48px;
  padding: 12px 36px;
  border-radius: 35px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 1.5px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  cursor: pointer;
  margin-top: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.bday-btn:hover {
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
}

/* Canvas for background ambient effects & confetti */
#pujaCanvas, #burstCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 5;
}
#burstCanvas {
  z-index: 99;
}

/* Top Bar Controls */
.top-bar {
  position: fixed;
  top: 4px;
  right: 12px;
  z-index: 50;
  display: flex;
  gap: 8px;
}

.icon-btn {
  background: rgba(43, 17, 25, 0.75);
  color: var(--gold);
  border: 1px solid rgba(212, 175, 55, 0.4);
  min-height: 30px;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 13px;
  font-family: 'Cormorant Garamond', serif;
  cursor: pointer;
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  gap: 5px;
}
.icon-btn:hover {
  background: var(--rose);
  color: #fff;
}

/* Book Container - FILL VISIBLE SCREEN HEIGHT */
.book-container {
  perspective: 1800px;
  width: min(560px, 94vw);
  height: min(840px, calc(100dvh - 76px));
  position: relative;
  z-index: 10;
  margin: auto;
}

/* Main Book Element */
.book {
  width: 100%;
  height: 100%;
  background: var(--page-bg);
  border-radius: 4px 12px 12px 4px;
  box-shadow: 
    -12px 0 0 -5px var(--cover-bg),
    -18px 0 0 -8px var(--cover-border),
    0 22px 55px var(--shadow),
    inset 18px 0 22px -10px rgba(0, 0, 0, 0.15);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  transform-style: preserve-3d;
}

#pages{flex:1;min-height:0;display:flex;flex-direction:column}
.page-content{min-height:0}
.sakha{font-family:"Dancing Script",cursive;font-size:30px;color:#d62839;text-align:center;margin-top:22px}
.sakha .hrt{display:inline-block;animation:hb 1.4s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.sakha .hrt{animation:none}}
/* Page Element - ABSOLUTELY NO VERTICAL SCROLL */
.page {
  flex: 1;
  display: none;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(14px, 3.5vw, 28px) clamp(16px, 4vw, 32px);
  position: relative;
  background: var(--page-bg);
  background-image: radial-gradient(ellipse at center, transparent 60%, rgba(138, 100, 60, 0.04) 100%);
  transform-origin: left center;
  backface-visibility: hidden;
  overflow: hidden;
}

.page.on {
  display: flex;
  animation: turn3D 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
}

@keyframes turn3D {
  0% {
    opacity: 0;
    transform: perspective(1400px) rotateY(-20deg) translateX(15px) scale(0.98);
  }
  100% {
    opacity: 1;
    transform: perspective(1400px) rotateY(0deg) translateX(0) scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .page.on {
    animation: fadeOnly 0.3s ease;
  }
  @keyframes fadeOnly {
    from { opacity: 0; }
    to { opacity: 1; }
  }
}

.page-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
  position: relative;
  z-index: 2;
}

/* Bengali Alpona Corner Ornaments */
.alpona-corner {
  position: absolute;
  width: 36px;
  height: 36px;
  opacity: 0.18;
  pointer-events: none;
  color: var(--rose);
}
.alpona-tl { top: 8px; left: 8px; }
.alpona-tr { top: 8px; right: 8px; transform: scaleX(-1); }
.alpona-bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
.alpona-br { bottom: 8px; right: 8px; transform: scale(-1); }

/* Cover Styling */
.cover {
  background: var(--cover-bg);
  background-image: 
    radial-gradient(circle at 50% 40%, rgba(212, 175, 55, 0.12) 0%, transparent 70%),
    repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 4px);
  text-align: center;
  align-items: center;
  border: 10px solid var(--cover-bg);
  outline: 2px solid rgba(212, 175, 55, 0.4);
  outline-offset: -6px;
  padding: 24px 16px;
}

.cover .page-content{position:static;align-items:center;justify-content:center;gap:4px}
.cover h1{margin-bottom:10px}
.cover .open{margin-top:12px}
.cover-frame {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  bottom: 14px;
  border: 1px solid var(--gold);
  pointer-events: none;
  opacity: 0.7;
}

.cover h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(34px, 8.5vw, 56px);
  font-weight: 700;
  line-height: 1.05;
  margin: 0;
  background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
}

.cover .by {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic;
  color: var(--gold-light);
  margin: 18px 0 28px;
  font-size: 19px;
  opacity: 0.9;
}

.rule {
  width: 70px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 16px auto;
}

.open {
  background: linear-gradient(135deg, #8c243b 0%, #6d1c2b 100%);
  color: var(--gold-light);
  border: 1px solid var(--gold);
  min-height: 46px;
  padding: 10px 30px;
  border-radius: 30px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 1px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.ded {
  font-style: italic;
  text-align: center;
  color: var(--soft);
  font-size: clamp(17px, 4vw, 20px);
  line-height: 1.8;
  font-family: 'Cormorant Garamond', Georgia, serif;
}

.toc h2 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(28px, 6vw, 34px);
  color: var(--rose);
  margin-bottom: 14px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
}

.toc button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  background: none;
  border: 0;
  border-bottom: 1px dotted var(--line);
  min-height: 44px;
  padding: 6px 4px;
  color: var(--ink);
  text-align: left;
  font-size: clamp(15px, 3.8vw, 17px);
  font-family: 'Lora', serif;
}
.toc button:hover {
  color: var(--rose);
  padding-left: 6px;
}

/* Auto-Fitting Chapter Content Container */
.ch-fit {
  display: flex;
  flex-direction: column;
  justify-content: center;
  font-size: 16px;
  line-height: 1.6;
  transition: none;
}

.ch .n {
  font-style: italic;
  color: var(--soft);
  margin-bottom: 4px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.95em;
}

.ch h2 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.8em;
  color: var(--rose);
  margin: 0 0 8px;
  font-weight: 600;
  line-height: 1.15;
}

.epi {
  font-style: italic;
  color: var(--soft);
  border-left: 3px solid var(--rose);
  padding-left: 10px;
  margin: 0 0 12px;
  font-size: 0.92em;
  line-height: 1.45;
}

.ch p {
  margin: 0 0 0.75em;
  text-align: justify;
}

/* FIXED DROP CAP BUG: Applied strictly to body-first paragraph, NEVER epigraph */
.ch p.body-first::first-letter {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3.2em;
  float: left;
  line-height: 0.8;
  padding: 2px 6px 0 0;
  color: var(--rose);
  font-weight: 700;
}

/* First Chapter Page Hint */
.ch-hint {
  font-style: italic;
  font-size: 12px;
  color: var(--soft);
  text-align: center;
  margin-bottom: 6px;
  font-family: 'Cormorant Garamond', serif;
  letter-spacing: 0.5px;
}

/* Dedicated Polaroid Screen (Chapter 3) */
.polaroid-page {
  text-align: center;
}
.polaroid-wrapper {
  position: relative;
  display: inline-block;
  margin: 6px auto;
  transform: rotate(-1.5deg);
}

.washi-tape {
  position: absolute;
  top: -10px;
  left: 20px;
  width: 60px;
  height: 18px;
  background: rgba(230, 210, 180, 0.7);
  border: 1px dashed rgba(180, 150, 120, 0.4);
  transform: rotate(-8deg);
  z-index: 10;
}
.washi-tape-right {
  left: auto;
  right: 20px;
  transform: rotate(6deg);
}

.ph {
  display: block;
  max-width: 88vw;
  max-height: clamp(200px, 48vh, 320px);
  margin: 0 auto;
  border: 10px solid #ffffff;
  border-bottom: 36px solid #ffffff;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
  border-radius: 2px;
}
.ph-caption-old {
  font-family: 'Dancing Script', cursive;
  color: var(--rose);
  font-size: 20px;
  margin-top: -28px;
  position: relative;
  z-index: 15;
}

.sh {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.1em;
  line-height: 1.45;
  text-align: center;
  color: var(--rose);
  margin: 8px 0;
  padding: 8px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.sh::before {
  content: "\2766";
  display: block;
  font-style: normal;
  margin-bottom: 4px;
  color: var(--gold);
}

/* Margin Notes Screen */
.note-page h2 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(24px, 5.5vw, 30px);
  color: var(--rose);
  margin-bottom: 6px;
}
.note-page p {
  font-style: italic;
  color: var(--soft);
  font-size: 14px;
  margin-bottom: 12px;
}
.note-page textarea {
  width: 100%;
  box-sizing: border-box;
  height: clamp(160px, 42vh, 280px);
  background: rgba(0, 0, 0, 0.02);
  color: var(--ink);
  border: 1px dashed var(--soft);
  border-radius: 6px;
  padding: 12px;
  font: italic 16px 'Lora', serif;
  resize: none;
  line-height: 1.6;
}

/* Final Chapter 5 Handwriting & Proposal */
.plan-handwriting {
  font-size: clamp(20px, 4.8vw, 24px);
  color: var(--rose);
  font-family: 'Dancing Script', cursive;
  line-height: 1.7;
  text-align: left;
  background: rgba(212, 175, 55, 0.06);
  padding: 18px;
  border-radius: 8px;
  border-left: 3px solid var(--gold);
}

.yes-btn {
  background: linear-gradient(135deg, #8c243b, #c8536d);
  color: #fff;
  border: 1px solid var(--gold);
  min-height: 48px;
  padding: 12px 34px;
  border-radius: 30px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  box-shadow: 0 4px 15px rgba(140, 36, 59, 0.4);
  cursor: pointer;
  margin-top: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.thank-you-card {
  margin-top: 16px;
  padding: 14px;
  background: rgba(140, 36, 59, 0.08);
  border: 1px solid var(--rose);
  border-radius: 8px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 20px;
  color: var(--rose);
}

/* Diya Glow Effect for Chapter 4 */
.diya-container {
  position: absolute;
  bottom: 8px;
  right: 12px;
  display: flex;
  gap: 10px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.8s ease;
}
.ch4-active .diya-container {
  opacity: 1;
}
.diya-flame {
  width: 12px;
  height: 20px;
  background: radial-gradient(ellipse at bottom, #fff 0%, #ffaa00 40%, #ff3300 80%, transparent 100%);
  border-radius: 50% 50% 20% 20%;
  animation: flicker 1.2s infinite alternate ease-in-out;
  filter: drop-shadow(0 0 8px #ffaa00);
}
@keyframes flicker {
  0% { transform: scale(0.95) rotate(-2deg); opacity: 0.85; }
  100% { transform: scale(1.1) rotate(2deg); opacity: 1; }
}

/* Navigation Bar PINNED TO BOTTOM OF BOOK */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-top: 1px solid var(--line);
  color: var(--soft);
  font-size: 13px;
  background: var(--page-bg);
  z-index: 20;
  min-height: 48px;
  flex-shrink: 0;
}
.nav button {
  background: none;
  border: 0;
  color: var(--ink);
  min-height: 44px;
  padding: 4px 10px;
  font-size: 15px;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
}
.nav button:hover:not(:disabled) {
  background: rgba(140, 36, 59, 0.08);
  color: var(--rose);
}
.nav button:disabled {
  opacity: 0.25;
  cursor: default;
}

.next-pulse {
  color: var(--rose) !important;
  font-weight: 700 !important;
  animation: pulseGlow 1.8s infinite ease-in-out;
}
@keyframes pulseGlow {
  0% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 6px rgba(140, 36, 59, 0.4); }
  100% { transform: scale(1); opacity: 0.85; }
}

:focus-visible {
  outline: 2px solid var(--rose);
  outline-offset: 2px;
}
.send-note{margin-top:14px;min-height:44px;width:100%;background:#8c2f46;color:#fbf6ea;border:0;border-radius:8px;font:600 15px "Lora",serif;cursor:pointer}
.ph-caption{position:absolute;bottom:3px;left:0;right:0;margin:0;font-family:'Dancing Script',cursive;font-size:22px;line-height:1;color:var(--rose,#8c2f46);z-index:15}
.polaroid-page{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;position:relative}
.polaroid-page .ph{max-height:clamp(170px,36dvh,300px)}
.wish-title{font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(28px,8vw,38px);margin-top:18px;background:linear-gradient(135deg,#9a6a14,#c4922e 45%,#b0304f 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;position:relative;z-index:3}
.wish-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(15px,4.4vw,19px);line-height:1.5;text-align:center;max-width:30ch;margin-top:6px;color:var(--ink,#2b2220);position:relative;z-index:3}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.floaters span{position:absolute;bottom:-40px;font-size:22px;opacity:0;animation:floatUp 7s linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.8}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.floaters span{animation:none;opacity:.4;bottom:20%}}
.wa-ok{font-size:13px;margin-top:8px;color:var(--soft,#7a6a5c);text-align:center}.wa-fallback{display:block;text-align:center;margin-top:6px;color:#8c2f46;font-weight:600;text-decoration:underline}
</style>
</head>

const HER="Aparajita", PET="Rani", HIM="Rohan", PETME="Ron";
const chapters=[
 {t:"Chapter 1: The Night Shift",epi:"Some stories begin with a bang. Ours began with a ping.",
  body:["We were in class 12, two people with exams to study for and absolutely no intention of studying. It started with one message on WhatsApp, something small enough that neither of us remembers the first words.","Then the hours disappeared. The house went quiet, the screen glowed, and somewhere between a joke and a confession it became three in the morning. She was typing, then not typing, then typing again. I was grinning at a phone like a fool.","I called her Rani that year, and the name stayed. She called me Ron, and I have never wanted to be called anything else by anyone else."]},
 {t:"Chapter 2: Burdwan",epi:"After a thousand messages, the first face behind the words.",
  body:["For so long she had been a voice in my head and a name on my screen. Then one day, in Burdwan, she was simply there, real and smiling, and every late-night word suddenly had a face.","We went to the temple together. Neither of us remembers what we prayed for, but I remember walking beside her, trying to look calm while my heart behaved like it had somewhere else to be.","At the Burdwan temple she wore a beautiful dress, and she had such a beautiful smile that I forgot what I came to pray for. If I prayed for anything at all, it was for that moment not to end."]},
 {t:"Chapter 3: The Birthday",epi:"Some doors you only knock on once to be welcomed forever.",
  body:["The first time I came to her house was her birthday. I stood outside longer than I will ever admit, rehearsing how to be someone's favourite person in front of her family.","Rani, I think you already knew the answer. You always do.","She looked so beautiful that day that I forgot every line I had rehearsed.","On her birthday I stood beside her, quietly waiting for the clock so I could be the first to wish her a happy birthday. That day she looked like an apsara who had come down from heaven."]},
 {t:"Chapter 4: Durga Puja",epi:"Last year, we followed the sound of the dhak wherever it led.",
  body:["Last year, Durga Puja belonged to us. Pandal after pandal, street after street, we travelled so much that the festival turned into a map of the two of us.","We were tired, crowded, hungry, and happy. The lights, the crowds, the incense, and her hand somewhere near mine: if you asked me to describe the perfect week, I would just point at that one. And then there was the saree she wore, and for a while I forgot every pandal I had come to see.","Last year, on my scooty, I was the driver and she sat behind me, holding me tight. We rode from pandal to pandal, such a long drive that I wished would never end. It is the best memory I have."]}

function add(html,cls){
  const d=document.createElement('div');
  d.className='page '+(cls||'');
  d.innerHTML=`<div class="page-content">${html}</div>` + (cls !== 'cover' ? alponaSVG : '');
  el.appendChild(d);
  pages.push(d);
}

const chStartPages = [];

// Page 1: Cover
add(`

add(`<div class="ded">For ${PET},<br>who reads a thousand stories<br>and still chose to live this one with me.<br><br>${HER}, this is yours.</div>`);

  const [n, ...r] = c.t.split(': ');
  chStartPages.push(pages.length + 1); // 1-based start page
  
  const hintHTML = (i === 0) ? `<div class="ch-hint">&larr; Tap Next or swipe to turn the page &rarr;</div>` : '';
  
  // Format ALL body paragraphs, applying drop cap strictly to body-first paragraph
  const bodyHTML = c.body.map((p, idx) => `<p class="${idx === 0 ? 'body-first' : ''}">${esc(p)}</p>`).join('');
  
  // Chapter Text Page (ONE PAGE FOR ALL TEXT OF THIS CHAPTER)
  add(`
    <div class="ch ch-fit ${i===3?'ch4-active':''}">
      ${hintHTML}
      <div class="n">${esc(n)}</div>
      <h2>${esc(r.join(': '))}</h2>
      <p class="epi">${esc(c.epi)}</p>
      ${bodyHTML}
      ${SHAYARI[i] ? `<p class="sh">${SHAYARI[i]}</p>` : ''}
      ${i===3 ? `<div class="diya-container"><div class="diya-flame"></div><div class="diya-flame" style="animation-delay:0.4s"></div></div>` : ''}
    </div>
  `);

  // Dedicated Polaroid Screen for Chapter 3
  if (i === 2 && PHOTO) {
    add(`
      <div class="polaroid-page">
        <div class="polaroid-wrapper">
          <div class="washi-tape"></div>
          <div class="washi-tape washi-tape-right"></div>
          <img class="ph" src="${PHOTO}" alt="${PET}">
          <div class="ph-caption">${PET}</div>
        </div>
        <div class="wish-title">Happy Birthday, Rani &#10084;</div>
        <div class="wish-text">May every day ahead be as beautiful as your smile. Today the whole sky is celebrating you, and I am the luckiest one standing beside you.</div>
        <div class="floaters" aria-hidden="true">${Array.from({length:16},(_,k)=>`<span style="left:${(k*6.3+3)%94}%;animation-delay:${(k*0.7)%6}s;animation-duration:${6+(k%4)}s">${['&#127880;','&#10024;','&#10084;&#65039;','&#127800;'][k%4]}</span>`).join('')}</div>
      </div>
    `);
  }

});

// Chapter 5: Unwritten (3 distinct pages)
chStartPages.push(pages.length + 1);

// Ch5 Page 1: Title, Epigraph, Shayari
add(`
  <div class="ch ch-fit">
    <div class="n">Chapter 5</div>
    <h2 style="font-size:32px;color:var(--rose)">Unwritten</h2>
    <p class="epi">Every good novel knows when to hand the pen over.</p>
    <p class="sh" style="margin-top:24px">${FINAL_SH}</p>
  </div>
`);

// Ch5 Page 2: Puri Jagannath Temple Arati Date Plan (Handwriting)
add(`
  <div class="ch ch-fit" style="text-align:left">
    <div class="n" style="font-style:italic">Chapter 5 &mdash; The Plan</div>
    <div class="plan-handwriting" style="margin-top:16px">
      Our next date is Puri, for your birthday trip: sitting side by side at the Jagannath Temple arati, with the evening bells and nothing else to do.
    </div>
  </div>
`);

// Ch5 Page 3: Final Proposal Screen
add(`
  <div class="blank" style="margin-top:0">
    <div class="plan-handwriting" style="text-align:center;margin-bottom:20px">
      And Durga Puja in Kolkata is only days away, so I have one question, Rani:<br>

    </div>
    <button class="yes-btn" id="yesBtn" onclick="handleYesClick(this)">Yes, Ron &#10084;</button>
    <div id="thankYouContainer"></div>
    <div class="sakha">your Sakha <span class="hrt">&#10084;&#65039;</span></div>
  </div>
`);

// Last page: a page for Rani to write to Ron
add(`
  <div class="note-page">
    <h2>A page for you, Rani</h2>
    <p>Write whatever your heart says, then send it to Ron.</p>
    <textarea data-k="noteRani" placeholder="Dear Ron..."></textarea>
    <button class="send-note" onclick="sendNote(this)">Send this note to Ron on WhatsApp &#10084;</button>
    <div class="wa-ok" style="display:none">If WhatsApp does not open, tap the link below.</div>
    <a class="wa-fallback" style="display:none">Open WhatsApp</a>
  </div>
`);

// Populate Table of Contents Items
const tocContainer = document.getElementById('tocContainer');
const chTitles = [
  "Chapter 1: The Night Shift",
  "Chapter 2: Burdwan",
  "Chapter 3: The Birthday",
  "Chapter 4: Durga Puja",
  "Chapter 5: Unwritten"
];
chTitles.forEach((title, idx) => {
  const btn = document.createElement('button');
  btn.onclick = () => go(chStartPages[idx] - 1);
  btn.innerHTML = `<span>${esc(title)}</span><span>&#8250;</span>`;
  tocContainer.appendChild(btn);
});

// Put Ron's WhatsApp number here with country code, digits only (example: "919876543210"). Leave empty to let her pick the contact.
const RON_WHATSAPP = "";
function sendNote(b){
  const box = b.parentElement, t = box.querySelector('textarea').value.trim();
  const fb = box.querySelector('.wa-fallback'), ok = box.querySelector('.wa-ok');
  if (!t) { b.textContent = 'Write a note first, then tap here'; return; }
  const msg = "Rani's note for you: " + t;
  const url = 'https://wa.me/' + RON_WHATSAPP.replace(/\D/g, '') + '?text=' + encodeURIComponent(msg);
  try { navigator.clipboard.writeText(msg).then(()=>{ok.textContent='Your note is copied. If WhatsApp does not open, tap the link below and paste it.'}).catch(()=>{}); } catch (e) {}
  fb.href = url; fb.style.display = 'block'; ok.style.display = 'block';
  fb.target = '_blank'; fb.rel = 'noopener'; fb.click();
}
let cur = 0;

// JS AUTO-FIT ENGINE: Dynamically shrinks font size until page text fits perfectly with NO scrolling
function autoFitCurrentPage() {
  const activePage = pages[cur];
  if (!activePage) return;
  
  const fitContainer = activePage.querySelector('.ch-fit');
  const contentWrapper = activePage.querySelector('.page-content');
  if (!fitContainer || !contentWrapper) return;

  const maxH = contentWrapper.clientHeight - 4;
  let fs = 12;
  const set = f => { fitContainer.style.fontSize = f + 'px'; fitContainer.style.lineHeight = f < 15 ? '1.5' : '1.7'; };
  set(fs);
  while (fs < 22 && fitContainer.scrollHeight <= maxH) { fs += 0.5; set(fs); }
  if (fitContainer.scrollHeight > maxH) { fs -= 0.5; set(fs); }
  while (fs > 10 && fitContainer.scrollHeight > maxH) { fs -= 0.5; set(fs); }
}

function go(i) {
  cur = Math.max(0, Math.min(pages.length - 1, i));
  pages.forEach((p, j) => p.classList.toggle('on', j === cur));
  
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === pages.length - 1;
  document.getElementById('pg').textContent = cur > 1 ? `Page ${cur - 1} of ${pages.length - 2}` : '';
  
  // Run Auto-fit for active page text
  setTimeout(autoFitCurrentPage, 20);

  // Check if current page belongs to Chapter 4 (Durga Puja) for marigold petals canvas
  const ch4StartIndex = chStartPages[3] - 1;
  const ch5StartIndex = chStartPages[4] - 1;
  if (cur >= ch4StartIndex && cur < ch5StartIndex) {
    startPetals();
  } else {
    stopPetals();
  }
}

window.addEventListener('resize', () => {
  autoFitCurrentPage();
  resizeCanvases();
  resizeBdayCanvas();
});

window.addEventListener('orientationchange', () => {
  setTimeout(autoFitCurrentPage, 100);
});

document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);

// Touch Swipe Navigation for Mobile
let touchStartX = 0, touchEndX = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

document.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  if (touchEndX < touchStartX - 45) go(cur + 1);
  if (touchEndX > touchStartX + 45) go(cur - 1);
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});

document.querySelectorAll('textarea').forEach(t => {
  try { t.value = localStorage.getItem(t.dataset.k) || '' } catch(e) {}
  t.addEventListener('input', () => {
    try { localStorage.setItem(t.dataset.k, t.value) } catch(e) {}
  });
});

// Theme Switcher
const themeBtn = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
themeBtn.onclick = () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  themeIcon.innerHTML = next === 'dark' ? '&#9788;' : '&#9790;';
};

function handleYesClick(btn) {
  btn.style.display = 'none';
  const thankYou = document.createElement('div');
  thankYou.className = 'thank-you-card';
  thankYou.innerHTML = `<i>Then it is settled. Puri for your birthday, then the pandals of Kolkata, together. ❤️</i>`;
  document.getElementById('thankYouContainer').appendChild(thankYou);
  
  triggerHeartBurst();
}

// Audio Engine: Supports relative song.mp3 and Web Audio API fallback
const songEl = document.getElementById('bgSong');
if (songEl) songEl.volume = 0.45;

let ac, mt, isMuted = false, synthPlaying = false;

function startAudio(forceStart) {
  if (forceStart) isMuted = false;
  
  const muBtn = document.getElementById('mu');
  muBtn.style.opacity = isMuted ? 0.4 : 1;

  if (isMuted) {
    if (songEl) songEl.pause();
    if (ac) ac.suspend();
    clearInterval(mt);
    synthPlaying = false;
    return;
  }

  if (songEl) {
    const playPromise = songEl.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {}).catch(err => {
        startSynthAudio();
      });
    }
  } else {
    startSynthAudio();
  }
}

function startSynthAudio() {
  if (synthPlaying || isMuted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    ac.resume();
    synthPlaying = true;

    const n = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];
    let k = 2, t = 0;
    const tone = (f, v, d, ty) => {
      if (isMuted) return;
      const o = ac.createOscillator(), g = ac.createGain(), w = ac.currentTime;
      o.type = ty;
      o.frequency.value = f;
      g.gain.setValueAtTime(0, w);
      g.gain.linearRampToValueAtTime(v, w + .04);
      g.gain.exponentialRampToValueAtTime(.0001, w + d);
      o.connect(g).connect(ac.destination);
      o.start(w);
      o.stop(w + d);
    };
    clearInterval(mt);
    mt = setInterval(() => {
      if (isMuted) return;
      k = Math.max(0, Math.min(n.length - 1, k + [-2, -1, 1, 2, 3][Math.floor(Math.random() * 5)]));
      tone(n[k], .06, 2.8, 'sine');
      if (t++ % 4 === 0) tone(n[0] / 2, .04, 4.0, 'triangle');
    }, 550);
  } catch(e) {}
}

document.getElementById('mu').onclick = () => {
  isMuted = !isMuted;
  startAudio(false);
};

// Tap to Begin (Birthday Opening Screen)
document.getElementById('startBtn').onclick = () => {
  startAudio(true);
  const bdayScreen = document.getElementById('birthdayScreen');
  bdayScreen.classList.add('fade-out');
  stopBdayCanvas();
  go(2); // Jump directly to Table of Contents page
};

// Birthday Canvas Engine (Sparkles, Petals, Floating Particles)
const bdayCanvas = document.getElementById('bdayCanvas');
const bCtx = bdayCanvas.getContext('2d');
let bdayAnimId = null;

function resizeBdayCanvas() {
  bdayCanvas.width = window.innerWidth;
  bdayCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeBdayCanvas);
resizeBdayCanvas();

const sparkles = Array.from({ length: 45 }, () => ({
  x: Math.random() * bdayCanvas.width,
  y: Math.random() * bdayCanvas.height,
  size: Math.random() * 3 + 1,
  speedY: Math.random() * 0.6 + 0.2,
  alpha: Math.random(),
  alphaSpeed: Math.random() * 0.02 + 0.008
}));

function animateBday() {
  bCtx.clearRect(0, 0, bdayCanvas.width, bdayCanvas.height);
  sparkles.forEach(s => {
    s.y -= s.speedY;
    s.alpha += s.alphaSpeed;
    if (s.alpha > 1 || s.alpha < 0) s.alphaSpeed = -s.alphaSpeed;
    if (s.y < -10) s.y = bdayCanvas.height + 10;
    
    bCtx.save();
    bCtx.globalAlpha = Math.abs(s.alpha);
    bCtx.fillStyle = '#ffd700';
    bCtx.beginPath();
    bCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    bCtx.fill();
    bCtx.restore();
  });
  bdayAnimId = requestAnimationFrame(animateBday);
}
animateBday();

function stopBdayCanvas() {
  if (bdayAnimId) {
    cancelAnimationFrame(bdayAnimId);
    bdayAnimId = null;
  }
}

// Particle Canvas Systems (Marigold Petals & Heart Burst)
const pCanvas = document.getElementById('pujaCanvas');
const pCtx = pCanvas.getContext('2d');
let pAnimationId = null;
let petals = [];

function resizeCanvases() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
  const bCanvas = document.getElementById('burstCanvas');
  bCanvas.width = window.innerWidth;
  bCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvases);
resizeCanvases();

function startPetals() {
  if (pAnimationId) return;
  petals = Array.from({ length: 25 }, () => ({
    x: Math.random() * pCanvas.width,
    y: Math.random() * pCanvas.height - pCanvas.height,
    r: Math.random() * 6 + 4,
    d: Math.random() * 1 + 0.5,
    color: ['#ffaa00', '#ff7700', '#ffd700', '#e65100'][Math.floor(Math.random() * 4)],
    tilt: Math.random() * 10,
    tiltAngle: 0,
    tiltAngleInc: Math.random() * 0.05 + 0.02
  }));
  
  function update() {
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    petals.forEach(p => {
      p.tiltAngle += p.tiltAngleInc;
      p.y += (Math.cos(p.d) + 1 + p.r / 2) / 2;
      p.x += Math.sin(p.d);
      p.tilt = Math.sin(p.tiltAngle) * 15;
      
      if (p.y > pCanvas.height) {
        p.y = -20;
        p.x = Math.random() * pCanvas.width;
      }
      
      pCtx.beginPath();
      pCtx.lineWidth = p.r / 2;
      pCtx.strokeStyle = p.color;
      pCtx.fillStyle = p.color;
      pCtx.moveTo(p.x + p.tilt + p.r / 4, p.y);
      pCtx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 4);
      pCtx.stroke();
    });
    pAnimationId = requestAnimationFrame(update);
  }
  update();
}

function stopPetals() {
  if (pAnimationId) {
    cancelAnimationFrame(pAnimationId);
    pAnimationId = null;
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  }
}

// Heart & Flower Burst
function triggerHeartBurst() {
  const bCanvas = document.getElementById('burstCanvas');
  const bCtx = bCanvas.getContext('2d');
  const particles = Array.from({ length: 80 }, () => ({
    x: bCanvas.width / 2,
    y: bCanvas.height / 2 + 100,
    vx: (Math.random() - 0.5) * 14,
    vy: (Math.random() - 0.7) * 16,
    size: Math.random() * 14 + 8,
    color: ['#e57b93', '#ff4d6d', '#ffb703', '#e63946', '#ffffff'][Math.floor(Math.random() * 5)],
    rotation: Math.random() * Math.PI * 2,
    vRot: (Math.random() - 0.5) * 0.2,
    life: 1,
    decay: Math.random() * 0.015 + 0.01
  }));

  function drawHeart(ctx, x, y, size, color, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -size / 4);
    ctx.quadraticCurveTo(size / 2, -size, size, -size / 4);
    ctx.quadraticCurveTo(size, size / 3, 0, size);
    ctx.quadraticCurveTo(-size, size / 3, -size, -size / 4);
    ctx.quadraticCurveTo(-size / 2, -size, 0, -size / 4);
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
    let active = false;
    particles.forEach(p => {
      if (p.life > 0) {
        active = true;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.rotation += p.vRot;
        p.life -= p.decay;
        bCtx.globalAlpha = Math.max(0, p.life);
        drawHeart(bCtx, p.x, p.y, p.size, p.color, p.rotation);
      }
    });
    if (active) requestAnimationFrame(animate);
    else bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
  }
  animate();
}

go(0);
</script>
